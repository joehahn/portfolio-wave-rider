<svg xmlns="http://www.w3.org/2000/svg" width="860" height="756" viewBox="0 0 860 756" role="img" aria-label="Top-to-bottom pipeline. Search terms and trusted sources feed the news. The investor profile feeds the AI curator. News flows into the AI curator, which ingests the news, proposes ticker adds and removes to the watchlist, and manages the news citations justifying each change. The curator updates watchlist.csv, which feeds the mean-variance optimizer, which outputs recommended weights, which are rendered as static Plotly dashboards, after which you place the trades and edit holdings.csv, looping back to the news at the next rebalance.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- explicit light background so the diagram reads identically in GitHub's dark theme -->
  <rect x="0" y="0" width="860" height="756" fill="#ffffff"/>

  <!-- ============ left column: the two user-authored config inputs (dashed = config, not a pipeline step) ============ -->

  <rect x="30" y="35" width="250" height="62" rx="8" fill="#fbfbfc" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="155" y="63" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">search terms + trusted sources</text>
  <text x="155" y="85" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">gkg_config.json &#183; news_sources.md</text>
  <line x1="280" y1="66" x2="316" y2="66" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw)"/>

  <rect x="30" y="161" width="250" height="80" rx="8" fill="#fbfbfc" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="155" y="190" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">investor_profile.md</text>
  <text x="155" y="211" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">wave thesis, exclusions,</text>
  <text x="155" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">watchlist size</text>
  <line x1="280" y1="201" x2="316" y2="201" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw)"/>

  <!-- ============ main column: the pipeline ============ -->

  <!-- News -->
  <rect x="320" y="40" width="440" height="52" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="72" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2328">News</text>

  <line x1="540" y1="92" x2="540" y2="124" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- AI Curator: the only judgment call in the loop -->
  <rect x="320" y="126" width="440" height="150" rx="10" fill="#fff3cd" stroke="#d39e00" stroke-width="2.5"/>
  <text x="540" y="157" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2328">AI Curator</text>
  <text x="352" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">&#8226;&#160; ingests the news</text>
  <text x="352" y="214" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">&#8226;&#160; proposes ticker adds / removes to the watchlist</text>
  <text x="352" y="240" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">&#8226;&#160; manages the news citations justifying each change</text>

  <line x1="540" y1="276" x2="540" y2="308" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- watchlist -->
  <rect x="320" y="310" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="340" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328">watchlist.csv</text>

  <line x1="540" y1="358" x2="540" y2="390" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- optimizer -->
  <rect x="320" y="392" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="422" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328">mean-variance optimizer</text>

  <line x1="540" y1="440" x2="540" y2="472" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- recommended weights -->
  <rect x="320" y="474" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="504" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">recommended weights</text>

  <line x1="540" y1="522" x2="540" y2="554" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- dashboards: its own step -->
  <rect x="320" y="556" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="586" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">static Plotly dashboards</text>

  <line x1="540" y1="604" x2="540" y2="636" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- you -->
  <rect x="320" y="638" width="440" height="62" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="664" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">you: place the trades,</text>
  <text x="540" y="686" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">then edit holdings.csv</text>

  <!-- feedback loop back to the news -->
  <path d="M 540 700 L 540 726 L 808 726 L 808 66 L 764 66" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arw)"/>
  <text x="794" y="396" text-anchor="middle" transform="rotate(-90 794 396)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#57606a">next rebalance</text>
</svg>
