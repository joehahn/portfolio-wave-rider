<svg xmlns="http://www.w3.org/2000/svg" width="860" height="848" viewBox="0 0 860 848" role="img" aria-label="Top-to-bottom pipeline. News is the outside-world data source. The retriever reads your search terms and trusted sources and fetches and ranks articles into a dated pool. The AI curator reads that pool plus the user's investment thesis, proposes ticker adds and removes to the watchlist, and manages the news citations justifying each change. The curator updates watchlist.csv, which feeds the mean variance portfolio optimizer. The optimizer also reads ticker prices, daily closes from yfinance, and outputs recommended portfolio weights, which are rendered as dashboards, after which you place the trades, looping back to the retriever at the next rebalance.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- explicit light background so the diagram reads identically in GitHub's dark theme -->
  <rect x="0" y="0" width="860" height="848" fill="#ffffff"/>

  <!-- Visual grammar: dashed box = user-authored config file; solid box = data source or pipeline step. -->

  <!-- ============ News: the outside world, the raw data ============ -->
  <rect x="320" y="40" width="440" height="52" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="72" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2328">News</text>

  <line x1="540" y1="92" x2="540" y2="124" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ============ Retriever: reads the search terms, fetches + ranks ============ -->
  <rect x="30" y="126" width="250" height="62" rx="8" fill="#fbfbfc" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="155" y="154" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">search terms + trusted sources</text>
  <text x="155" y="176" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">retrieval_config.json &#183; news_sources.md</text>
  <line x1="280" y1="157" x2="316" y2="157" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw)"/>

  <rect x="320" y="126" width="440" height="62" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="153" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328">Retriever</text>
  <text x="540" y="175" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#57606a">fetches and ranks articles into a dated pool</text>

  <line x1="540" y1="188" x2="540" y2="220" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ============ AI Curator: the only judgment call in the loop ============ -->
  <rect x="30" y="271" width="250" height="62" rx="8" fill="#fbfbfc" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="155" y="299" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">investor_profile.md</text>
  <text x="155" y="321" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">user's investment thesis</text>
  <line x1="280" y1="302" x2="316" y2="302" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw)"/>

  <rect x="320" y="222" width="440" height="160" rx="10" fill="#fff3cd" stroke="#d39e00" stroke-width="2.5"/>
  <text x="540" y="254" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2328">AI Curator</text>
  <text x="352" y="288" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">&#8226;&#160; reads the ranked article pool</text>
  <text x="352" y="315" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">&#8226;&#160; proposes ticker adds / removes to the watchlist</text>
  <text x="352" y="342" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">&#8226;&#160; manages the news citations justifying each change</text>

  <line x1="540" y1="382" x2="540" y2="414" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ============ watchlist ============ -->
  <rect x="320" y="416" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328">watchlist.csv</text>

  <line x1="540" y1="464" x2="540" y2="496" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ============ optimizer: prices feed HERE, not the curator ============ -->
  <rect x="30" y="491" width="250" height="62" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="155" y="519" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">ticker prices</text>
  <text x="155" y="541" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">daily closes (yfinance)</text>
  <line x1="280" y1="522" x2="316" y2="522" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="320" y="498" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328">mean variance portfolio optimizer</text>

  <line x1="540" y1="546" x2="540" y2="578" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ============ recommended portfolio weights ============ -->
  <rect x="320" y="580" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="610" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">recommended portfolio weights</text>

  <line x1="540" y1="628" x2="540" y2="660" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ============ dashboards: its own step ============ -->
  <rect x="320" y="662" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="692" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">dashboards</text>

  <line x1="540" y1="710" x2="540" y2="742" stroke="#57606a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ============ you ============ -->
  <rect x="320" y="744" width="440" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="540" y="774" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">you: place the trades</text>

  <!-- feedback loop back to the RETRIEVER, not the News: the news arrives regardless of this loop, so
       the retriever is the first step the pipeline actually re-runs for a new as-of date. -->
  <path d="M 540 792 L 540 818 L 808 818 L 808 157 L 764 157" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arw)"/>
  <text x="794" y="488" text-anchor="middle" transform="rotate(-90 794 488)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#57606a">next rebalance</text>
</svg>
