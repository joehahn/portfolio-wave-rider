[project]
name = "portfolio-wave-rider"
version = "0.2.0"
description = "An AI agent reads an unstructured news feed and curates a watchlist while a mechanical optimizer sizes the portfolio. Research project by JMH DataSciences."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Joseph M. Hahn", email = "jmh.datasciences@gmail.com" },
]
# Dual-licensed: README.md, GLOSSARY.md and docs/ are CC BY 4.0 (see LICENSE-docs.md);
# the code and internal docs are PolyForm Noncommercial (see LICENSE.md). This field
# names the license the packaged CODE ships under.
license = { text = "PolyForm-Noncommercial-1.0.0" }

dependencies = [
    # core: profile parsing, optimizer math, price data, dashboards
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "plotly>=5.0",
    "pyyaml>=6.0",
    # GKG backtest (shipped feature): GDELT GKG ingest on BigQuery, Wayback/live lede fetch + extraction,
    # and the OpenRouter/Anthropic curator LLM. See src/portfolio.curator_backtest + scripts/backtest_sdk.py.
    "google-cloud-bigquery>=3.20",   # GKG (GDELT) ingest on BigQuery
    "google-auth>=2.30",             # service-account creds for the BigQuery client (google.oauth2)
    "requests>=2.31",                # Wayback / GDELT / OpenRouter HTTP
    "trafilatura>=2.1.0",            # archived-article body extraction (Wayback availability API + this)
    "anthropic>=0.40",               # Claude SDK (backtest curator + judge)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
